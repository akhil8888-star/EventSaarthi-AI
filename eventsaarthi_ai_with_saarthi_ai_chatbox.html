<!DOCTYPE html>

  <style>
    body {
      background-color: #101522;
      color: #F4E7C8;

    }
    /* Custom Scrollbar for Chat & App */
    ::-webkit-scrollbar {

      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #171F31;
    }
    ::-webkit-scrollbar-thumb {

    .gold-border-glow {

      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;

<body class="min-h-screen text-slate-100 selection:bg-amber-500 selection:text-slate-950">

  <div id="root"></div>

  <!-- Firebase Modular Imports via standard script tag -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Setup global Firebase reference bridge for React component access
    window.FirebaseBridge = {
      initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut,
      getFirestore, doc, getDoc, setDoc, updateDoc, collection, onSnapshot
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- HELPER CONSTANTS & DUMMY INITIAL DATA ---
    const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'eventsaarthi-default-id';
    
    const INITIAL_EVENTS = [
      {
        id: 'evt-1',
        name: 'Aarav & Ananya Royal Wedding',
        type: 'Wedding',
        date: '2026-11-18',
        location: 'Udaipur Palace Grounds, Rajasthan',
        guestCount: 350,
        budget: 2500000,
        spent: 1450000,
        theme: 'Royal Rajasthani Heritage',
        status: 'Planning'
      },
      {
        id: 'evt-2',
        name: 'Rohan 30th Birthday Bash',
        type: 'Birthday',
        date: '2026-12-05',
        location: 'Cyber Hub Lounge, Gurugram',
        guestCount: 65,
        budget: 180000,
        spent: 42000,
        theme: 'Neon Retro Cyberpunk',
        status: 'Confirmed'
      }
    ];

    const INITIAL_CHECKLIST = [
      { id: 'c1', eventId: 'evt-1', task: 'Finalize Palace Mandap Decorator', category: 'Decor', completed: true, dueDate: '2026-09-15' },
      { id: 'c2', eventId: 'evt-1', task: 'Send WhatsApp Save-the-Date Cards', category: 'Guests', completed: true, dueDate: '2026-09-20' },
      { id: 'c3', eventId: 'evt-1', task: 'Sample Royal Thali Menu tasting with Caterer', category: 'Food', completed: false, dueDate: '2026-10-30' },
      { id: 'c4', eventId: 'evt-2', task: 'Book DJ & Light Show Techs', category: 'Entertainment', completed: false, dueDate: '2026-11-10' },
    ];

    const INITIAL_GUESTS = [
      { id: 'g1', eventId: 'evt-1', name: 'Rajesh Sharma', category: 'VIP', status: 'Accepted', diet: 'Strict Jain', count: 4, seatingNote: 'Front Stage Table' },
      { id: 'g2', eventId: 'evt-1', name: 'Priya Verma', category: 'Family', status: 'Pending', diet: 'Vegetarian', count: 2, seatingNote: 'Family Courtyard' },
      { id: 'g3', eventId: 'evt-2', name: 'Karan Mehra', category: 'Friends', status: 'Accepted', diet: 'Non-Veg', count: 1, seatingNote: 'Bar Side' }
    ];

    const INITIAL_VENDORS = [
      { id: 'v1', name: 'Royal Rajputana Decorators', category: 'Decor', contact: '+91 98765 43210', quote: 650000, rating: 4.9, status: 'Booked' },
      { id: 'v2', name: 'Heritage Spice Caterers', category: 'Catering', contact: '+91 91234 56789', quote: 900000, rating: 4.8, status: 'Negotiating' },
      { id: 'v3', name: 'ShutterBeats Photography', category: 'Media', contact: '+91 99887 76655', quote: 220000, rating: 4.7, status: 'Shortlisted' }
    ];

    const INITIAL_SPECIAL_DAYS = [
      { id: 'sd1', name: 'Mom & Dad Anniversary', date: '2026-11-04', type: 'Anniversary', reminderDays: 7 },
      { id: 'sd2', name: 'Riya Diwali Gifting', date: '2026-11-08', type: 'Festival', reminderDays: 5 }
    ];

    // --- GEMINI API CALLER ---
    async function callGeminiApi(prompt, chatHistory = [], systemInstruction = "") {
      const apiKey = ""; // Canvas runtime automatically supplies API key when blank
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

      // Build turn structure
      const contents = [];
      
      // Inject previous turn context
      chatHistory.forEach(msg => {
        contents.push({
          role: msg.sender === 'user' ? 'user' : 'model',
          parts: [{ text: msg.text }]
        });
      });

      // Add current prompt
      contents.push({
        role: 'user',
        parts: [{ text: prompt }]
      });

      const payload = {
        contents: contents,
        systemInstruction: systemInstruction ? { parts: [{ text: systemInstruction }] } : undefined
      };

      try {
        const res = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          throw new Error(`Gemini API Error (Status ${res.status})`);
        }

        const data = await res.json();
        const candidate = data.candidates?.[0];
        if (candidate && candidate.content?.parts?.[0]?.text) {
          return candidate.content.parts[0].text;
        } else {
          throw new Error("Invalid response format from Gemini API.");
        }
      } catch (err) {
        console.error("Gemini API Invocation Exception:", err);
        throw err;
      }
    }

    // --- MAIN REACT APPLICATION COMPONENT ---
    function App() {
      // User State
      const [user, setUser] = useState({ uid: 'guest-user-123', email: 'planner@eventsaarthi.com', isGuest: true });
      const [isAuthenticated, setIsAuthenticated] = useState(true);
      const [activeTab, setActiveTab] = useState('dashboard'); // dashboard, events, planner, budget, checklist, guests, vendors, gifts, specialDays

      // Core Data States
      const [events, setEvents] = useState(INITIAL_EVENTS);
      const [selectedEventId, setSelectedEventId] = useState('evt-1');
      const [checklist, setChecklist] = useState(INITIAL_CHECKLIST);
      const [guests, setGuests] = useState(INITIAL_GUESTS);
      const [vendors, setVendors] = useState(INITIAL_VENDORS);
      const [specialDays, setSpecialDays] = useState(INITIAL_SPECIAL_DAYS);

      // Active Event Context Memo
      const currentEvent = useMemo(() => {
        return events.find(e => e.id === selectedEventId) || events[0] || null;
      }, [events, selectedEventId]);

      // --- SAARTHI AI CHATBOX STATES ---
      const [isChatOpen, setIsChatOpen] = useState(false);
      const [chatSessions, setChatSessions] = useState(() => {
        const saved = localStorage.getItem('saarthi_chat_sessions');
        return saved ? JSON.parse(saved) : [
          {
            id: 'session-default',
            title: 'Welcome to Saarthi AI',
            messages: [
              {
                id: 'm1',
                sender: 'ai',
                text: 'Namaste! I am Saarthi AI, your personal Indian Event & Celebration Strategist. How can I assist with your planning, budget, gifts, or vendors today?',
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
              }
            ]
          }
        ];
      });
      const [activeSessionId, setActiveSessionId] = useState('session-default');
      const [chatInput, setChatInput] = useState('');
      const [isAiLoading, setIsAiLoading] = useState(false);
      const [chatError, setChatError] = useState(null);
      const [isDrawerOpen, setIsDrawerOpen] = useState(false);
      const chatEndRef = useRef(null);

      // Save chat sessions locally & simulate user-level persistence
      useEffect(() => {
        localStorage.setItem('saarthi_chat_sessions', JSON.stringify(chatSessions));
      }, [chatSessions]);

      // Auto-scroll chat
      useEffect(() => {
        if (isChatOpen) {
          chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }
      }, [chatSessions, isChatOpen, isAiLoading]);

      // Active chat session getter
      const activeSession = useMemo(() => {
        return chatSessions.find(s => s.id === activeSessionId) || chatSessions[0];
      }, [chatSessions, activeSessionId]);

      // --- CHAT ACTIONS ---
      const handleSendMessage = async (textToSend) => {
        const promptText = textToSend || chatInput.trim();
        if (!promptText || isAiLoading) return;

        const userMsg = {
          id: 'user-' + Date.now(),
          sender: 'user',
          text: promptText,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        // Append user message immediately
        setChatSessions(prev => prev.map(session => {
          if (session.id === activeSessionId) {
            return {
              ...session,
              messages: [...session.messages, userMsg],
              // Auto-name untitled or default session if first user message
              title: session.messages.length <= 1 ? promptText.slice(0, 24) + '...' : session.title
            };
          }
          return session;
        }));

        setChatInput('');
        setIsAiLoading(true);
        setChatError(null);

        // System Instruction with Context Injection
        let systemPrompt = `You are Saarthi AI, an expert, warm, and highly experienced Indian Celebration & Event Strategist working within the EventSaarthi AI platform.
Provide helpful, highly contextual, structured, and practical advice on Indian weddings, birthdays, anniversaries, corporate galas, vendor negotiations, budget allocation in INR (₹), decor trends, and guest hospitality.`;

        if (currentEvent) {
          systemPrompt += `\n\nCURRENT EVENT CONTEXT:
- Name: ${currentEvent.name}
- Type: ${currentEvent.type}
- Target Date: ${currentEvent.date}
- Venue/Location: ${currentEvent.location}
- Guest Count: ${currentEvent.guestCount} guests
- Total Budget: ₹${currentEvent.budget.toLocaleString('en-IN')}
- Current Spent: ₹${currentEvent.spent.toLocaleString('en-IN')} (Remaining: ₹${(currentEvent.budget - currentEvent.spent).toLocaleString('en-IN')})
- Theme: ${currentEvent.theme}`;
        }

        try {
          // Send chat history without the current user message (will be passed as prompt)
          const historyForApi = activeSession.messages.filter(m => m.id !== userMsg.id);
          const aiResponseText = await callGeminiApi(promptText, historyForApi, systemPrompt);

          const aiMsg = {
            id: 'ai-' + Date.now(),
            sender: 'ai',
            text: aiResponseText,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };

          setChatSessions(prev => prev.map(session => {
            if (session.id === activeSessionId) {
              return { ...session, messages: [...session.messages, aiMsg] };
            }
            return session;
          }));
        } catch (err) {
          setChatError("Unable to reach Saarthi AI right now. Please check your network or API connection.");
        } finally {
          setIsAiLoading(false);
        }
      };

      const startNewChat = () => {
        const newId = 'session-' + Date.now();
        const newSession = {
          id: newId,
          title: 'New Conversation',
          messages: [
            {
              id: 'm1',
              sender: 'ai',
              text: 'Namaste! Saarthi AI is ready. How can I help you plan or optimize your event today?',
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            }
          ]
        };
        setChatSessions(prev => [newSession, ...prev]);
        setActiveSessionId(newId);
        setIsDrawerOpen(false);
      };

      const handleQuickAction = (actionPrompt) => {
        setIsChatOpen(true);
        handleSendMessage(actionPrompt);
      };

      // --- EVENT HANDLERS FOR MAIN CONTENT ---
      const handleCreateEvent = (newEvent) => {
        const created = { ...newEvent, id: 'evt-' + Date.now(), spent: 0, status: 'Planning' };
        setEvents([created, ...events]);
        setSelectedEventId(created.id);
      };

      return (
        <div className="min-h-screen bg-brand-dark flex flex-col font-sans">
          
          {/* HEADER / NAVIGATION BAR */}
          <header className="sticky top-0 z-30 bg-brand-navy/95 backdrop-blur border-b border-brand-borderGold px-4 lg:px-8 py-3.5 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 via-amber-400 to-yellow-200 flex items-center justify-center shadow-lg shadow-amber-500/10">
                <i data-lucide="sparkles" class="w-5 h-5 text-slate-950 font-bold"></i>
              </div>
              <div>
                <h1 className="font-serif text-xl font-bold tracking-wide gold-gradient-text">EventSaarthi AI</h1>
                <p className="text-[10px] text-amber-200/60 uppercase tracking-widest hidden sm:block">Every Celebration Deserves to Go Right</p>
              </div>
            </div>

            {/* Event Selector Dropdown */}
            {currentEvent && (
              <div className="hidden md:flex items-center space-x-2 bg-brand-dark/60 border border-brand-borderGold px-3 py-1.5 rounded-lg">
                <i data-lucide="calendar" class="w-4 h-4 text-amber-400"></i>
                <span className="text-xs text-amber-200/70 font-medium">Active:</span>
                <select 
                  value={selectedEventId}
                  onChange={(e) => setSelectedEventId(e.target.value)}
                  className="bg-transparent text-xs font-semibold text-amber-100 focus:outline-none cursor-pointer"
                >
                  {events.map(evt => (
                    <option key={evt.id} value={evt.id} className="bg-brand-navy text-slate-100">{evt.name}</option>
                  ))}
                </select>
              </div>
            )}

            {/* Auth / Profile */}
            <div className="flex items-center space-x-3">
              <span className="text-xs text-amber-200/80 hidden sm:inline-block">Planner: <strong className="text-white">{user.email}</strong></span>
              <button 
                onClick={() => setIsAuthenticated(!isAuthenticated)} 
                className="px-3 py-1.5 text-xs font-medium rounded-lg bg-amber-400/10 border border-brand-borderGold text-amber-300 hover:bg-amber-400/20 transition"
              >
                {isAuthenticated ? 'Sign Out' : 'Sign In'}
              </button>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <div className="flex-1 flex flex-col lg:flex-row">
            
            {/* SIDEBAR NAVIGATION */}
            <aside className="w-full lg:w-64 bg-brand-navy border-r border-brand-borderGold/40 p-4 shrink-0">
              <nav className="space-y-1">
                {[
                  { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                  { id: 'events', label: 'My Events', icon: 'calendar-heart' },
                  { id: 'planner', label: 'AI Planner', icon: 'sparkles' },
                  { id: 'budget', label: 'Budget Tracker', icon: 'indian-rupee' },
                  { id: 'checklist', label: 'Checklist & Timeline', icon: 'check-square' },
                  { id: 'guests', label: 'Guest Manager', icon: 'users' },
                  { id: 'vendors', label: 'Vendor Hub', icon: 'briefcase' },
                  { id: 'gifts', label: 'Gift Finder & Shop', icon: 'gift' },
                  { id: 'specialDays', label: 'Special Days', icon: 'bell' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition ${
                      activeTab === item.id 
                        ? 'bg-amber-400/15 text-amber-300 border border-brand-borderGold font-semibold shadow-sm' 
                        : 'text-amber-100/70 hover:bg-brand-card hover:text-white'
                    }`}
                  >
                    <i data-lucide={item.icon} class={`w-4 h-4 ${activeTab === item.id ? 'text-amber-400' : 'text-slate-400'}`}></i>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>

              {/* Active Event Card Summary in Sidebar */}
              {currentEvent && (
                <div className="mt-8 p-3.5 rounded-xl bg-brand-dark/70 border border-brand-borderGold/30 text-xs">
                  <div className="flex items-center justify-between text-amber-300 mb-2">
                    <span className="font-semibold uppercase text-[10px] tracking-wider">Active Event</span>
                    <span className="px-1.5 py-0.5 rounded bg-amber-400/20 text-[10px]">{currentEvent.type}</span>
                  </div>
                  <h4 className="font-semibold text-slate-100 truncate">{currentEvent.name}</h4>
                  <p className="text-slate-400 text-[11px] mt-1">{currentEvent.date} • {currentEvent.guestCount} Guests</p>
                  <div className="mt-2.5 w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
                    <div 
                      className="bg-gradient-to-r from-amber-500 to-amber-300 h-1.5 rounded-full" 
                      style={{ width: `${Math.min(100, (currentEvent.spent / currentEvent.budget) * 100)}%` }}
                    ></div>
                  </div>
                  <div className="flex justify-between mt-1 text-[10px] text-slate-400">
                    <span>Spent: ₹{currentEvent.spent.toLocaleString('en-IN')}</span>
                    <span>Max: ₹{(currentEvent.budget / 100000).toFixed(1)}L</span>
                  </div>
                </div>
              )}
            </aside>

            {/* DYNAMIC DASHBOARD / FEATURE VIEWS */}
            <main className="flex-1 p-4 lg:p-8 overflow-y-auto">
              {activeTab === 'dashboard' && (
                <DashboardView 
                  events={events} 
                  currentEvent={currentEvent} 
                  checklist={checklist} 
                  onQuickAction={handleQuickAction}
                  setActiveTab={setActiveTab}
                />
              )}
              {activeTab === 'events' && (
                <EventsManagerView events={events} onCreate={handleCreateEvent} setSelectedEventId={setSelectedEventId} />
              )}
              {activeTab === 'planner' && (
                <AiPlannerView currentEvent={currentEvent} onQuickAction={handleQuickAction} />
              )}
              {activeTab === 'budget' && (
                <BudgetTrackerView currentEvent={currentEvent} onQuickAction={handleQuickAction} />
              )}
              {activeTab === 'checklist' && (
                <ChecklistView checklist={checklist} setChecklist={setChecklist} currentEvent={currentEvent} />
              )}
              {activeTab === 'guests' && (
                <GuestManagerView guests={guests} setGuests={setGuests} currentEvent={currentEvent} />
              )}
              {activeTab === 'vendors' && (
                <VendorHubView vendors={vendors} onQuickAction={handleQuickAction} />
              )}
              {activeTab === 'gifts' && (
                <GiftFinderView currentEvent={currentEvent} onQuickAction={handleQuickAction} />
              )}
              {activeTab === 'specialDays' && (
                <SpecialDaysView specialDays={specialDays} setSpecialDays={setSpecialDays} />
              )}
            </main>
          </div>

          {/* ========================================================= */}
          {/* FLOATING SAARTHI AI ASSISTANT CHAT TRIGGER & PANEL        */}
          {/* ========================================================= */}
          {!isChatOpen && (
            <button
              onClick={() => setIsChatOpen(true)}
              className="fixed bottom-6 right-6 z-40 flex items-center space-x-2.5 px-4 py-3 rounded-full bg-gradient-to-r from-amber-400 via-yellow-400 to-amber-500 text-slate-950 font-bold shadow-2xl hover:scale-105 active:scale-95 transition-all gold-border-glow group"
            >
              <div className="w-7 h-7 rounded-full bg-slate-950/10 flex items-center justify-center">
                <i data-lucide="bot" class="w-5 h-5 text-slate-950"></i>
              </div>
              <span className="text-sm tracking-wide">Ask Saarthi AI</span>
              <span className="relative flex h-2 w-2">
                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-slate-950 opacity-75"></span>
                <span className="relative inline-flex rounded-full h-2 w-2 bg-slate-900"></span>
              </span>
            </button>
          )}

          {/* EXPANDED CHAT PANEL */}
          {isChatOpen && (
            <div className="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 z-50 w-[calc(100vw-2rem)] sm:w-[420px] h-[580px] max-h-[85vh] bg-brand-navy border border-brand-borderGold rounded-2xl shadow-2xl flex flex-col overflow-hidden chat-slide-up">
              
              {/* CHAT HEADER */}
              <div className="bg-brand-card px-4 py-3 border-b border-brand-borderGold/40 flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <button 
                    onClick={() => setIsDrawerOpen(!isDrawerOpen)}
                    className="p-1.5 rounded-lg text-amber-300 hover:bg-amber-400/10 transition"
                    title="Conversation History"
                  >
                    <i data-lucide="history" class="w-5 h-5"></i>
                  </button>
                  <div>
                    <div className="flex items-center space-x-1.5">
                      <h3 className="font-serif font-bold text-amber-300 text-sm">Saarthi AI Assistant</h3>
                      <span className="text-[9px] bg-amber-400/20 text-amber-200 px-1.5 py-0.5 rounded uppercase tracking-wider font-semibold">Gemini 3</span>
                    </div>
                    <p className="text-[10px] text-amber-200/60 truncate max-w-[200px]">{activeSession.title}</p>
                  </div>
                </div>

                <div className="flex items-center space-x-1">
                  <button 
                    onClick={startNewChat}
                    className="p-1.5 rounded-lg text-amber-300 hover:bg-amber-400/10 transition text-xs flex items-center space-x-1"
                    title="New Chat"
                  >
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                  </button>
                  <button 
                    onClick={() => setIsChatOpen(false)}
                    className="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition"
                  >
                    <i data-lucide="x" class="w-5 h-5"></i>
                  </button>
                </div>
              </div>

              {/* SESSION DRAWER SLIDE-OVER */}

                  onClick={() => onQuickAction(`Draft a negotiation email for vendor ${v.name} with quote ₹${v.quote}.`)}
                  className="px-3 py-1.5 bg-amber-400/15 border border-brand-borderGold text-amber-300 rounded-lg text-xs font-medium hover:bg-amber-400/25 transition"
                >
                  🤝 AI Negotiate Quote
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function GiftFinderView({ currentEvent, onQuickAction }) {
      return (
        <div className="space-y-4">
          <h2 className="font-serif text-2xl font-bold gold-gradient-text">Gift Finder & Recommendations</h2>
          <div className="bg-brand-navy p-6 rounded-2xl border border-brand-borderGold/40 text-center space-y-4">
            <p className="text-sm text-slate-300 max-w-lg mx-auto">
              Find 3-tier gift suggestions with Amazon, Flipkart, and Ferns N Petals search links.
            </p>
            <button 
              onClick={() => onQuickAction("Suggest 3 premium return gift ideas for guests with purchase links.")}
              className="px-5 py-2.5 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-bold text-xs rounded-xl shadow-lg hover:opacity-95 transition"
            >
              🎁 Find AI Gifts
            </button>
          </div>
        </div>
      );
    }

    function SpecialDaysView({ specialDays, setSpecialDays }) {
      return (
        <div className="space-y-4">
          <h2 className="font-serif text-2xl font-bold gold-gradient-text">Special Days & Reminders</h2>
          <div className="bg-brand-navy p-5 rounded-2xl border border-brand-borderGold/40 space-y-3">
            {specialDays.map(sd => (
              <div key={sd.id} className="flex justify-between items-center p-3 bg-brand-card rounded-xl border border-brand-borderGold/20 text-xs">
                <div>
                  <h4 className="font-bold text-white">{sd.name}</h4>
                  <p className="text-slate-400 text-[11px]">Date: {sd.date} • Remind {sd.reminderDays} days prior</p>
                </div>
                <span className="px-2 py-1 rounded bg-amber-400/20 text-amber-300">{sd.type}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- INITIALIZE LUCIDE ICONS ON MOUNT & UPDATES ---
    function LucideIconInitializer() {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });
      return null;
    }

    // --- RENDER APP ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <React.Fragment>
        <App />
        <LucideIconInitializer />
      </React.Fragment>
    );
  </script>
</body>
</html>
